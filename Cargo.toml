[workspace]
members = [
    "crates/xray-core",
    "crates/xray-cli",
    "crates/xray-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Xray Contributors"]
license = "MIT"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Parsing
tree-sitter = "0.22"

# Graph
petgraph = "0.6"

# String interning
lasso = { version = "0.7", features = ["multi-threaded"] }

# Hashing
blake3 = "1"

# Cache
rusqlite = { version = "0.31", features = ["bundled"] }
bincode = "2"

# CLI
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"

# File walking
ignore = "0.4"

# Parallel processing
rayon = "1"

# HTTP server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }

# Embedding
rust-embed = "8"

# Browser launch
webbrowser = "1"

# File watching
notify = "6"

# WASM
wasm-bindgen = "0.2"

# Home directory
dirs = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

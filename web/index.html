<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xray — Codebase Visualizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <span id="logo">Xray</span>
    <input id="search" type="search" placeholder="Search nodes..." autocomplete="off" />
    <div id="mode-toggle">
      <button class="mode-btn active" data-mode="file">File</button>
      <button class="mode-btn" data-mode="function">Fn</button>
    </div>
    <div id="layout-toggle">
      <button class="layout-btn active" data-layout="force">Force</button>
      <button class="layout-btn" data-layout="hierarchical">Hierarchy</button>
    </div>
    <button id="export-btn">Export ▾</button>
  </header>

  <main id="canvas-container">
    <div id="loading">Loading graph...</div>
  </main>

  <footer id="statusbar">
    <div id="node-detail">
      <span id="node-path">Select a node</span>
      <span id="node-lang"></span>
      <span id="node-fn-sig" style="display:none"></span>
      <button id="blast-radius-btn" disabled>Blast Radius ▶</button>
    </div>
    <div id="graph-stats">
      <span id="stat-files">0 files</span>
      <span id="stat-edges">0 edges</span>
      <span id="stat-functions" style="display:none">0 fns</span>
    </div>
  </footer>

  <!-- Pro feature gate modal -->
  <div id="pro-gate-overlay" class="pro-gate-overlay" style="display:none">
    <div class="pro-gate-modal">
      <div class="pro-gate-header">
        <span class="pro-badge">PRO</span>
        <h2>Function-Level Analysis</h2>
      </div>
      <p>Drill into individual functions, classes, and call graphs. Enter your Xray Pro license key to unlock.</p>
      <input id="pro-key-input" type="text" placeholder="xray-pro-xxxxxxxx" autocomplete="off" spellcheck="false" />
      <div class="pro-gate-actions">
        <button id="pro-key-submit">Unlock Pro</button>
        <button id="pro-gate-close">Cancel</button>
      </div>
      <a href="#" class="pro-upgrade-link">Get Xray Pro →</a>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
